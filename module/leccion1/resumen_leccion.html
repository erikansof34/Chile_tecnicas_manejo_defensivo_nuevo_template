                        {"end":4.94,"start":0,"text":"El curso de técnicas de manejo defensivo, un espacio virtual diseñado para fortalecer"},
                        {"end":6.88,"start":4.94,"text":"nuestra cultura de prevención vial."},
                        {"end":12.76,"start":7.6,"text":"El objetivo principal es transformar nuestras conductas y actitudes al volante, protegiendo"},

                        {"end":17.88,"start":17.3,"text":"día a día."},
                        {"end":24.16,"start":18.72,"text":"Nos enfocaremos en recordar y aplicar las técnicas de manejo defensivo más efectivas para conducir"},

                        {"end":35.6,"start":30.6,"text":"El manejo defensivo es una técnica de conducción que busca prevenir accidentes y proteger la"},

                        {"end":43.62,"start":39.16,"text":"Se basa en la prudencia y el respeto por las normas de tránsito, requiriendo una"},
                        {"end":48.46,"start":43.62,"text":"actitud responsable y previsiva al volante, evitando comportamientos imprudentes."},
                        {"end":53.4,"start":49.34,"text":"Por otro lado, la conducción no defensiva incluye comportamientos como."},

                        {"end":62.26,"start":60.22,"text":"No respetar los límites de velocidad."},
                        {"end":64.9,"start":63.26,"text":"Conducir en estado de abriedad."},
                        {"end":67.66,"start":65.74,"text":"No mantener el vehículo en buen estado."},
                        {"end":70.58,"start":68.46,"text":"No respetar las señales de tránsito."},
                        {"end":74.18,"start":71.34,"text":"No mantener una distancia segura con otros vehículos."},
                        {"end":79.82,"start":75.06,"text":"Este curso nos invita a reflexionar sobre la importancia de actuar de forma proactiva para"},
